name: build-zerotier-aarch64
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build static zerotier-one (aarch64 musl via qemu)
        run: |
          docker run --rm --platform linux/arm64/v8 -v "$PWD":/build -w /build alpine:3.21 sh -c "
            set -e
            apk add --no-cache build-base linux-headers git
            git clone --depth 1 --branch 1.16.2 https://github.com/zerotier/ZeroTierOne.git
            cd ZeroTierOne
            make static -j2 2>&1 | tee build.log
            ls -la zerotier-one
          "
          mkdir -p out
          cp ZeroTierOne/zerotier-one out/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-one-aarch64
          path: out/
          retention-days: 7