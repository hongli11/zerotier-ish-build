name: build-zerotier-aarch64

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install aarch64 musl cross-compiler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-musl g++-aarch64-linux-musl

      - name: Checkout ZeroTier One
        uses: actions/checkout@v4
        with:
          repository: zerotier/ZeroTierOne
          ref: 1.16.2
          submodules: recursive
          path: ZeroTierOne

      - name: Build zerotier-one static aarch64
        run: |
          set -euo pipefail
          cd ZeroTierOne
          make ZT_STATIC=1 CC=aarch64-linux-musl-gcc HOSTOS=Linux HOSTCPU=aarch64 \
            -j$(nproc) 2>&1 | tee build.log
          file zerotier-one zerotier-cli zerotier-idtool

      - name: Create output directory
        run: mkdir -p out

      - name: Copy artifacts
        run: cp ZeroTierOne/zerotier-one ZeroTierOne/zerotier-cli ZeroTierOne/zerotier-idtool out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-one-aarch64
          path: out/
          retention-days: 7
