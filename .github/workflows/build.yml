name: build-zerotier-aarch64

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download musl cross-compiler
        run: |
          set -euo pipefail
          curl -fsSL "https://musl.cc/aarch64-linux-musl-cross.tgz" -o /tmp/musl-cross.tgz
          tar xzf /tmp/musl-cross.tgz -C /tmp
          echo "/tmp/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          aarch64-linux-musl-gcc --version
          aarch64-linux-musl-g++ --version

      - name: Checkout ZeroTier One
        uses: actions/checkout@v4
        with:
          repository: zerotier/ZeroTierOne
          ref: 1.16.2
          submodules: recursive
          path: ZeroTierOne
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build zerotier-one static aarch64
        run: |
          set -euo pipefail
          cd ZeroTierOne
          make ZT_STATIC=1 \
            CC=aarch64-linux-musl-gcc \
            CXX=aarch64-linux-musl-g++ \
            -j$(nproc) 2>&1 | tee build.log
          file zerotier-one zerotier-cli zerotier-idtool

      - name: Create output directory
        run: mkdir -p out

      - name: Copy artifacts
        run: cp ZeroTierOne/zerotier-one ZeroTierOne/zerotier-cli ZeroTierOne/zerotier-idtool out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-one-aarch64
          path: out/
          retention-days: 7
