name: build-zerotier-aarch64
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Build static zerotier-one (native aarch64 musl)
        run: |
          docker run --rm -v "$PWD":/build -w /build alpine:3.21 sh -c "
            set -euo pipefail
            apk add --no-cache build-base linux-headers git
            git clone --depth 1 --branch 1.16.2 https://github.com/zerotier/ZeroTierOne.git
            cd ZeroTierOne
            make static -j\$(nproc) 2>&1 | tee build.log
            file zerotier-one
          "
          mkdir -p out
          cp ZeroTierOne/zerotier-one out/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-one-aarch64
          path: out/
          retention-days: 7