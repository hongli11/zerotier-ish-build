name: build-zerotier-aarch64

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download ZeroTier One source
        run: |
          curl -fsSL "https://github.com/zerotier/ZeroTierOne/archive/refs/tags/1.16.2.tar.gz" -o zerotier.tar.gz
          tar xzf zerotier.tar.gz
          mv ZeroTierOne-1.16.2 ZeroTierOne
          cd ZeroTierOne && git init && git submodule update --init --recursive || true

      - name: Build in Alpine aarch64 container
        run: |
          docker run --rm \
            -v "$PWD/ZeroTierOne:/src" \
            -v "$PWD/out:/out" \
            alpine:3.19 \
            sh -c '
              apk add --no-cache make gcc g++ musl-dev linux-headers git tar
              cd /src
              make ZT_STATIC=1 -j$(nproc)
              cp zerotier-one zerotier-cli zerotier-idtool /out/
            '

      - name: Verify artifacts
        run: |
          file out/zerotier-one out/zerotier-cli out/zerotier-idtool

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-one-aarch64
          path: out/
          retention-days: 7
