name: build-zerotier-aarch64

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install aarch64 musl cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-musl g++-aarch64-linux-musl
          aarch64-linux-musl-gcc --version

      - name: Download ZeroTier One source
        run: |
          curl -fsSL "https://github.com/zerotier/ZeroTierOne/archive/refs/tags/1.16.2.tar.gz" -o zerotier.tar.gz
          tar xzf zerotier.tar.gz
          mv ZeroTierOne-1.16.2 ZeroTierOne
          cd ZeroTierOne && git submodule update --init --recursive

      - name: Build zerotier-one static aarch64
        run: |
          cd ZeroTierOne
          make ZT_STATIC=1 \
            CC=aarch64-linux-musl-gcc \
            CXX=aarch64-linux-musl-g++ \
            -j4 2>&1 | tee build.log
          file zerotier-one zerotier-cli zerotier-idtool

      - name: Create output directory
        run: mkdir -p out

      - name: Copy artifacts
        run: cp ZeroTierOne/zerotier-one ZeroTierOne/zerotier-cli ZeroTierOne/zerotier-idtool out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-one-aarch64
          path: out/
          retention-days: 7
